name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: Install desktop dependencies
        run: python -m pip install -r desktop/requirements.txt

      - name: Compile current desktop entrypoint
        run: python -m py_compile desktop/main.py desktop/app_current.py desktop/roster_export.py

      - name: Run desktop build checks
        working-directory: desktop
        run: python verify_build.py

  portal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install portal dependencies
        working-directory: cloudflare
        run: npm install

      - name: Validate Worker source
        working-directory: cloudflare
        run: npm run check

      - name: Verify public preview boundary
        working-directory: cloudflare
        run: node scripts/verify-public-preview-v110.mjs
